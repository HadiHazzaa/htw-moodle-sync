name: Moodle Auto-Sync 24/7

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  moodle-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python 3.11 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten & Headless Chromium installieren
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium --with-deps

      - name: Rclone im Cloud-Runner installieren
        run: |
          sudo apt-get update && sudo apt-get install -y rclone

      - name: Moodle Skript ausführen
        env:
          HTW_USER: ${{ secrets.HTW_USER }}
          HTW_PASS: ${{ secrets.HTW_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python moodle_htwsaar_downloader.py

      - name: PDFs direkt ins OneDrive hochladen
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_DATA" > ~/.config/rclone/rclone.conf
          rclone copy moodle_downloads/ myonedrive:Moodle_PDFs --update

      - name: Commit und Push der download_history.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update download history [skip ci]"
          file_pattern: "download_history.json"
